<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>餐馆小费计算器</title>
  <meta name="theme-color" content="#4f46e5">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eeeefd',
              100: '#e0e0fc',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            }
          }
        }
      }
    }
  </script>
  <style>
    /* 移除数字输入框右侧上下箭头 */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }

</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col justify-between max-w-md mx-auto shadow-2xl relative font-sans antialiased selection:bg-brand-500 selection:text-white">

  <!-- Header -->
  <header class="bg-gradient-to-br from-brand-600 to-indigo-700 text-white p-6 rounded-b-3xl shadow-lg relative">
    <div class="flex justify-between items-center mb-2">
      <h1 class="text-2xl font-bold flex items-center gap-2">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
        </svg>
        餐馆小费计算器
      </h1>
      <button onclick="resetCalculator()" class="p-2 hover:bg-white/10 rounded-full transition-colors" title="重置">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
        </svg>
      </button>
    </div>
    <p class="text-indigo-200 text-xs font-medium">含 13% 消费税 (HST) 自动计算</p>
  </header>

  <!-- Main Form -->
  <main class="p-5 space-y-5 flex-1">
    
    <!-- 金额输入区域 -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200/80 space-y-4">
      <div>
        <label for="preTax" class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">
          餐费税前金额 (PRE-TAX AMOUNT)
        </label>
        <div class="relative flex items-center">
          <span class="absolute left-4 text-brand-600 font-bold text-2xl">$</span>
          <input 
            type="number" 
            id="preTax" 
            step="0.01" 
            placeholder="0.00" 
            class="w-full pl-9 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-[1.8rem] font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition-all placeholder:text-slate-300"
            oninput="calculate()"
            onblur="formatCurrencyInput(this)"
          >
        </div>
      </div>

      <div>
        <label for="cashPaid" class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">
          实付/给服务员金额 (CASH / AMOUNT PAID)
        </label>
        <div class="relative flex items-center">
          <span class="absolute left-4 text-brand-600 font-bold text-2xl">$</span>
          <input 
            type="number" 
            id="cashPaid" 
            step="0.01" 
            placeholder="0.00" 
            class="w-full pl-9 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-[1.8rem] font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition-all placeholder:text-slate-300"
            oninput="calculate()"
            onblur="formatCurrencyInput(this)"
          >
        </div>
      </div>
    </div>

    <!-- 小费比例选择 -->
    <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200/80 space-y-4">
      <div class="flex justify-between items-center">
        <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">选择小费比例 (TIP %)</label>
        <span id="selectedTipBadge" class="text-xs font-bold text-brand-600 bg-brand-50 px-2.5 py-1 rounded-full">12%</span>
      </div>

      <!-- 快速选择按钮 -->
      <div class="grid grid-cols-4 gap-2.5">
        <button type="button" onclick="selectTipPreset(10)" class="tip-btn py-3 rounded-xl border border-slate-200 font-bold text-slate-700 hover:border-brand-500 hover:text-brand-600 transition-all text-center" data-tip="10">10%</button>
        <button type="button" onclick="selectTipPreset(12)" class="tip-btn py-3 rounded-xl border border-slate-200 font-bold text-slate-700 hover:border-brand-500 hover:text-brand-600 transition-all text-center" data-tip="12">12%</button>
        <button type="button" onclick="selectTipPreset(15)" class="tip-btn py-3 rounded-xl border border-slate-200 font-bold text-slate-700 hover:border-brand-500 hover:text-brand-600 transition-all text-center" data-tip="15">15%</button>
        <button type="button" onclick="selectTipPreset(18)" class="tip-btn py-3 rounded-xl border border-slate-200 font-bold text-slate-700 hover:border-brand-500 hover:text-brand-600 transition-all text-center" data-tip="18">18%</button>
      </div>

      <!-- 自定义比例 -->
      <div class="flex items-center gap-2 pt-1">
        <span class="text-xs font-medium text-slate-400 shrink-0">自定义比例:</span>
        <div class="relative flex-1">
          <input 
            type="number" 
            id="customTip" 
            placeholder="其它" 
            min="0"
            max="100"
            class="w-full pr-8 text-right py-2 px-3 bg-slate-50 border border-slate-200 rounded-lg text-sm font-semibold text-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500"
            oninput="handleCustomTipInput()"
          >
          <span class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 font-semibold text-sm">%</span>
        </div>
      </div>
    </div>

    <!-- 结算显示面板 -->
    <div class="bg-indigo-950 text-white p-6 rounded-3xl shadow-xl space-y-4">
      <div class="space-y-2 text-sm text-indigo-200 pb-4 border-b border-indigo-900/80">
        <div class="flex justify-between">
          <span>税前金额 (Pre-Tax)</span>
          <span id="summaryPreTax" class="font-semibold text-white">$0.00</span>
        </div>
        <div class="flex justify-between">
          <span>消费税 (Tax 13%)</span>
          <span id="summaryTax" class="font-semibold text-white">$0.00</span>
        </div>
        <div class="flex justify-between">
          <span id="summaryTipLabel">小费金额 (12%)</span>
          <span id="summaryTip" class="font-semibold text-white">$0.00</span>
        </div>
      </div>

      <!-- 应付总额 -->
      <div class="pt-1 flex items-baseline justify-between">
        <div>
          <span class="text-xs uppercase tracking-wider text-indigo-300 font-bold block">应付总金额 TOTAL</span>
          <span id="perPersonLabel" class="text-[10px] text-indigo-400 hidden">(每人应付)</span>
        </div>
        <div id="totalAmount" class="text-4xl font-black text-white">$0.00</div>
      </div>

      <!-- 找零输出 -->
      <div class="pt-3 border-t border-indigo-900/80 flex items-baseline justify-between">
        <div>
          <span class="text-xs uppercase tracking-wider text-emerald-400 font-bold block">找零 CHANGE</span>
          <span class="text-[10px] text-indigo-400">(实付 - 总额)</span>
        </div>
        <div id="changeAmount" class="text-2xl font-bold text-emerald-400">$0.00</div>
      </div>
    </div>

    <!-- AA 平摊人数（现移至最下方） -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-brand-50 flex items-center justify-center text-brand-600 shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
          </svg>
        </div>
        <div>
          <div class="flex items-center gap-1.5 whitespace-nowrap">
            <span class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">平摊人数</span>
            <span id="splitLabel" class="text-[11px] text-slate-400 font-medium">· 1 人 AA</span>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-3 bg-slate-50 p-1.5 rounded-xl border border-slate-200">
        <button onclick="changePeople(-1)" class="w-8 h-8 rounded-lg bg-white shadow-sm flex items-center justify-center font-bold text-slate-600 hover:bg-slate-100">-</button>
        <span id="peopleCount" class="font-bold text-slate-800 w-6 text-center">1</span>
        <button onclick="changePeople(1)" class="w-8 h-8 rounded-lg bg-white shadow-sm flex items-center justify-center font-bold text-slate-600 hover:bg-slate-100">+</button>
      </div>
    </div>
  </main>

  <!-- JS 计算逻辑 -->
  <script>
    let currentTipRate = 12; // 默认小费 12%
    let people = 1;
    const TAX_RATE = 0.13;

    document.addEventListener('DOMContentLoaded', () => {
      selectTipPreset(12);
    });

    function selectTipPreset(rate) {
      currentTipRate = rate;
      document.getElementById('customTip').value = '';
      
      document.querySelectorAll('.tip-btn').forEach(btn => {
        if (parseFloat(btn.dataset.tip) === rate) {
          btn.className = 'tip-btn py-3 rounded-xl font-bold bg-brand-600 text-white shadow-md shadow-brand-500/30 transition-all text-center';
        } else {
          btn.className = 'tip-btn py-3 rounded-xl border border-slate-200 font-bold text-slate-700 hover:border-brand-500 hover:text-brand-600 transition-all text-center';
        }
      });

      calculate();
    }

    function handleCustomTipInput() {
      const customVal = parseFloat(document.getElementById('customTip').value);
      if (!isNaN(customVal) && customVal >= 0) {
        currentTipRate = customVal;
        document.querySelectorAll('.tip-btn').forEach(btn => {
          btn.className = 'tip-btn py-3 rounded-xl border border-slate-200 font-bold text-slate-700 hover:border-brand-500 hover:text-brand-600 transition-all text-center';
        });
        calculate();
      } else if (document.getElementById('customTip').value === '') {
        selectTipPreset(12);
      }
    }

    function changePeople(delta) {
      people = Math.max(1, people + delta);
      document.getElementById('peopleCount').textContent = people;
      document.getElementById('splitLabel').textContent = people > 1 ? `· ${people} 人平摊` : '· 1 人 AA';
      document.getElementById('perPersonLabel').classList.toggle('hidden', people === 1);
      calculate();
    }

    function formatCurrencyInput(input) {
      const val = parseFloat(input.value);
      if (!isNaN(val) && val > 0) {
        input.value = val.toFixed(2);
      }
    }

    function calculate() {
      const preTaxInput = parseFloat(document.getElementById('preTax').value) || 0;
      const cashPaidInput = parseFloat(document.getElementById('cashPaid').value) || 0;

      // 计算公式: (税前 * 1.13) + (税前 * 小费%)
      const taxAmount = preTaxInput * TAX_RATE;
      const tipAmount = preTaxInput * (currentTipRate / 100);
      const grandTotal = preTaxInput + taxAmount + tipAmount;
      const perPersonTotal = grandTotal / people;

      // 找零计算
      const change = cashPaidInput > 0 ? (cashPaidInput - grandTotal) : 0;

      // 更新界面 UI
      document.getElementById('selectedTipBadge').textContent = `${currentTipRate}%`;
      document.getElementById('summaryPreTax').textContent = `$${preTaxInput.toFixed(2)}`;
      document.getElementById('summaryTax').textContent = `$${taxAmount.toFixed(2)}`;
      document.getElementById('summaryTipLabel').textContent = `小费金额 (${currentTipRate}%)`;
      document.getElementById('summaryTip').textContent = `$${tipAmount.toFixed(2)}`;
      document.getElementById('totalAmount').textContent = `$${perPersonTotal.toFixed(2)}`;

      const changeEl = document.getElementById('changeAmount');
      if (cashPaidInput > 0) {
        if (change >= 0) {
          changeEl.textContent = `$${change.toFixed(2)}`;
          changeEl.className = "text-2xl font-bold text-emerald-400";
        } else {
          changeEl.textContent = `-$${Math.abs(change).toFixed(2)}`;
          changeEl.className = "text-2xl font-bold text-rose-400";
        }
      } else {
        changeEl.textContent = "$0.00";
        changeEl.className = "text-2xl font-bold text-emerald-400";
      }
    }

    function resetCalculator() {
      document.getElementById('preTax').value = '';
      document.getElementById('cashPaid').value = '';
      document.getElementById('customTip').value = '';
      people = 1;
      document.getElementById('peopleCount').textContent = '1';
      document.getElementById('splitLabel').textContent = '· 1 人 AA';
      document.getElementById('perPersonLabel').classList.add('hidden');
      selectTipPreset(12);
    }

    // PWA Offline Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swCode = `
          const CACHE_NAME = 'tip-calc-v4';
          self.addEventListener('install', (e) => {
            e.waitUntil(caches.open(CACHE_NAME).then((cache) => cache.addAll(['./'])));
          });
          self.addEventListener('fetch', (e) => {
            e.respondWith(caches.match(e.request).then((res) => res || fetch(e.request)));
          });
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(blob);
        navigator.serviceWorker.register(swUrl).catch(() => {});
      });
    }
  </script>
</body>
</html>
